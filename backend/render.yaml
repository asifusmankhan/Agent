services:
  - type: web
    name: asif-tech-ai-agent
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SHOPIFY_STORE_URL
        sync: false
      - key: SHOPIFY_ADMIN_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
